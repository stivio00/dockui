[package]
name = "dockui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fast, mouse-aware Docker TUI: containers, stats, logs, events, one-key ops and interactive shells"
authors = ["Stephen Krol <krol17@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/stivio00/dockui"
homepage = "https://github.com/stivio00/dockui"
readme = "README.md"
keywords = ["docker", "tui", "ratatui", "terminal", "dashboard"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
bollard = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.29.0"
futures-util = "0.3"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "sync", "io-util", "io-std"] }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
